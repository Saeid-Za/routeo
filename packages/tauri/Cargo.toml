[package]
name = "app"
version = "0.1.0"
description = "Routeo — desktop DNS manager"
authors = [ "Saeid Zareie <saeid.za98@gmail.com>" ]
license = "MIT"
repository = "https://github.com/Saeid-Za/routeo"
edition = "2024"
rust-version = "1.90.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.dev]
incremental = true
debug = 0
lto = false

[profile.release]
opt-level = "z" # Minimize size (use "s" if "z" causes issues)
lto = "fat" # Full LTO across all crates
codegen-units = 1 # Better inlining, smaller binary
strip = "symbols" # Remove symbols but keep enough for crash logs
panic = "abort" # Abort on panic (no stack unwinding)
debug = false # No debug info at all

# --- Additional binary cleanup ---
overflow-checks = false
incremental = false
rpath = false

[lib]
name = "app_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = [ "derive" ] }
log = "0.4"
tauri = { version = "2.8.5", features = ["tray-icon", "devtools" ] }
tauri-plugin-log = "2"
get_if_addrs = "0.5.3"
default-net = "0.22.0"
tokio = { version ="1.48.0", features = ["time", "net", "process"] }
netdev = "0.38.2"
sysinfo = { version = "0.37.2", features = ["network"] }
once_cell = "1.21.3"
tracing-subscriber = "0.3.20"
tracing = "0.1.41"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2.4.1"
